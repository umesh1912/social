name: Android APK

# Builds an installable APK of the Duo app (mobile/) on GitHub's runners and
# publishes it as a GitHub Release, so it can be downloaded straight to a phone.
on:
  push:
    branches: [duo-expo-app]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Report build failure
        if: failure()
        working-directory: .
        shell: bash
        run: |
          log="$RUNNER_TEMP/gradle.log"
          [ -f "$log" ] || exit 0
          # Surface Gradle's own summary as an annotation.
          msg=$(awk '/What went wrong:/{f=1} /\* Try:/{f=0} f' "$log" | head -c 3000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          [ -n "$msg" ] && echo "::error title=Gradle build failed::$msg"
          # Keep the full log readable without the Actions UI.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rfq . > /dev/null
          tail -n 4000 "$log" > gradle-${{ github.run_number }}.log
          git add gradle-${{ github.run_number }}.log
          git commit -qm "Gradle log for run ${{ github.run_number }}"
          git push -f origin ci-logs

      - name: Collect APK
        id: apk
        run: |
          src=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          mkdir -p ../dist
          cp "$src" ../dist/duo-${{ github.run_number }}.apk
          echo "file=dist/duo-${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: duo-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Duo APK (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            Android APK built from ${{ github.sha }}.
            Download `duo-${{ github.run_number }}.apk` on your Android phone and open it to install
            (allow "Install unknown apps" for your browser when asked).
          files: ${{ steps.apk.outputs.file }}
